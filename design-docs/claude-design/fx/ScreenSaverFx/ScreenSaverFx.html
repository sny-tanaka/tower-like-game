<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Fx — ScreenSaverFx</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .stage { height: 380px; background: var(--c-bg-deep); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); position: relative; overflow: hidden; }
  .info { font-size: 11px; color: var(--c-text-dim); line-height: 1.6; }
  .info ul { margin: 4px 0; padding-left: 18px; }
  .info ul li::marker { color: var(--c-primary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { ScreenSaverFx, Text, Icon } = window.TowerLikeGame_28197d;

  const lab = (txt, color, fs = 16) => (
    <Text variant="label" color={color} style={{ fontSize: fs, letterSpacing: '0.18em', whiteSpace: 'nowrap' }}>{txt}</Text>
  );

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>SCREEN SAVER FX</h1>
          <div className="sub">焼き付き防止: 何も常時表示しない。各要素は数秒だけ表示 → フェード → 位置瞬間移動。</div>
        </header>

        <div className="info">
          原則:
          <ul>
            <li>同じ位置に何も常時描画しない</li>
            <li>各 item は短時間 (~3s) だけ表示、フェード後に別位置で再出現</li>
            <li>過度な演出は不要。注視対象にしない</li>
            <li>5 種の経路 × index でずらす。経路ごとに 4 位置を巡る</li>
            <li>prefers-reduced-motion 時は最初の 1 件のみ中央に静止</li>
          </ul>
        </div>

        <div className="stage">
          <ScreenSaverFx items={[
            lab('AWAY', 'primary', 22),
            lab('TAP TO RESUME', 'dim', 11),
            lab('TIER 5', 'primary', 13),
            lab('WAVE 12', 'secondary', 13),
            lab('HP 78%', 'success', 13),
          ]} cycleSeconds={20} />
        </div>

        <div className="info">
          上ステージで実際にドリフトしています。常時表示の中央オブジェクトは <strong>ない</strong> ことを確認してください。
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
