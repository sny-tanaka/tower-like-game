<!-- @dsCard group="Fx" viewport="412x900" name="Battle Fx (4)" subtitle="DamagePopFx / EnemyDeathFx / BlastFx / LaserBeamFx" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><title>Fx — Battle</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--c-bg-deep); padding: 16px; color: var(--c-text); font-family: var(--ff-body); }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-size: 18px; margin: 0; }
  .sub { color: var(--c-text-dim); font-size: 12px; }
  .stage {
    position: relative;
    height: 240px;
    background:
      radial-gradient(ellipse at center, rgba(78,228,246,0.045), transparent 60%),
      repeating-linear-gradient(0deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      var(--c-bg-base);
    border: 1px solid var(--c-border-faint);
    border-radius: 8px;
    overflow: hidden;
  }
  .btn { font-family: var(--ff-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--c-bg-elev); border: 1px solid var(--c-primary); color: var(--c-primary); padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 8px; margin-right: 6px; }
</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { DamagePopFx, EnemyDeathFx, BlastFx, LaserBeamFx } = window.TowerLikeGame_28197d;

  function Page() {
    const [pops, setPops] = React.useState([]);
    const [deaths, setDeaths] = React.useState([]);
    const [blasts, setBlasts] = React.useState([]);
    const [beams, setBeams] = React.useState([]);
    const fire = (setter, base) => setter((prev) => [...prev, { id: Date.now() + Math.random(), ...base }]);

    return (
      <div className="page">
        <h1>BATTLE FX (4)</h1>
        <div className="sub">敵被ダメ / 撃破 / 範囲爆発 / レーザービーム。バトル中に再利用される演出。</div>

        <h2 style={{fontSize:12,color:'var(--c-primary)',margin:'8px 0 0',letterSpacing:'.08em'}}>DamagePopFx</h2>
        <div className="stage">
          {pops.map(p => <DamagePopFx key={p.id} value={p.value} x={p.x} y={p.y} crit={p.crit} onDone={() => setPops(s => s.filter(x => x.id !== p.id))} />)}
        </div>
        <div>
          <button className="btn" onClick={() => fire(setPops, { value: Math.floor(Math.random() * 5000), x: 20 + Math.random() * 60, y: 30 + Math.random() * 40 })}>通常</button>
          <button className="btn" onClick={() => fire(setPops, { value: Math.floor(Math.random() * 15000), x: 20 + Math.random() * 60, y: 30 + Math.random() * 40, crit: true })}>CRIT</button>
        </div>

        <h2 style={{fontSize:12,color:'var(--c-primary)',margin:'8px 0 0',letterSpacing:'.08em'}}>EnemyDeathFx</h2>
        <div className="stage">
          {deaths.map(d => <EnemyDeathFx key={d.id} x={d.x} y={d.y} color={d.color} onDone={() => setDeaths(s => s.filter(x => x.id !== d.id))} />)}
        </div>
        <div>
          <button className="btn" onClick={() => fire(setDeaths, { x: 20 + Math.random() * 60, y: 30 + Math.random() * 40 })}>通常敵</button>
          <button className="btn" onClick={() => fire(setDeaths, { x: 20 + Math.random() * 60, y: 30 + Math.random() * 40, color: 'var(--c-warning)' })}>Elite</button>
          <button className="btn" onClick={() => fire(setDeaths, { x: 20 + Math.random() * 60, y: 30 + Math.random() * 40, color: 'var(--c-danger)' })}>Boss</button>
        </div>

        <h2 style={{fontSize:12,color:'var(--c-primary)',margin:'8px 0 0',letterSpacing:'.08em'}}>BlastFx (Cannon)</h2>
        <div className="stage">
          {blasts.map(b => <BlastFx key={b.id} x={b.x} y={b.y} radius={b.radius} color={b.color} onDone={() => setBlasts(s => s.filter(x => x.id !== b.id))} />)}
        </div>
        <div>
          <button className="btn" onClick={() => fire(setBlasts, { x: 30 + Math.random() * 40, y: 30 + Math.random() * 40, radius: 8, color: 'var(--c-warning)' })}>小</button>
          <button className="btn" onClick={() => fire(setBlasts, { x: 30 + Math.random() * 40, y: 30 + Math.random() * 40, radius: 14, color: 'var(--c-danger)' })}>大</button>
        </div>

        <h2 style={{fontSize:12,color:'var(--c-primary)',margin:'8px 0 0',letterSpacing:'.08em'}}>LaserBeamFx</h2>
        <div className="stage">
          {beams.map(b => <LaserBeamFx key={b.id} x1={b.x1} y1={b.y1} x2={b.x2} y2={b.y2} onDone={() => setBeams(s => s.filter(x => x.id !== b.id))} />)}
        </div>
        <div>
          <button className="btn" onClick={() => fire(setBeams, { x1: 50, y1: 50, x2: 20 + Math.random() * 70, y2: 20 + Math.random() * 60 })}>発射</button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script></body></html>
