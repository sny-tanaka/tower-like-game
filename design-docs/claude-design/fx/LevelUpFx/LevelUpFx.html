<!-- @dsCard group="Fx" viewport="412x700" name="LevelUpFx" subtitle="強化購入時に UpgradeCard 上に発火 (マシン強化 / 武器強化 / ラン中 WS / パッチ Tier UP)" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--c-bg-deep); padding: 16px; font-family: var(--ff-body); color: var(--c-text); }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-size: 18px; margin: 0; }
  .sub { color: var(--c-text-dim); font-size: 12px; }
  .note { background: rgba(78,228,246,0.06); border: 1px solid rgba(78,228,246,0.3); border-radius: 6px; padding: 12px; font-size: 12px; color: var(--c-text-mid); line-height: 1.6; }
  .note strong { color: var(--c-primary); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .note ul li::marker { color: var(--c-primary); }
  .demo-area { position: relative; }
  .btn { font-family: var(--ff-display); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--c-bg-elev); border: 1px solid var(--c-primary); color: var(--c-primary); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { LevelUpFx, UpgradeCard } = window.TowerLikeGame_28197d;

  function Page() {
    const [fx, setFx] = React.useState([]);

    return (
      <div className="page">
        <h1>LEVEL UP FX</h1>
        <div className="sub">強化購入時に UpgradeCard の上でキラキラ。</div>

        <div className="note">
          <strong>具体的な使用シーン</strong>
          <ul>
            <li>マシン強化画面: +1 / +5 / MAX ボタン押下時 (押されたボタンの位置で発火)</li>
            <li>武器強化画面: 共通 Lv の +1 / +5 / MAX 押下時</li>
            <li>ラン中ワークショップ: 4 項目の強化購入時</li>
            <li>パッチ庫 合成タブ: Tier UP (MergeSuccess と併用可)</li>
          </ul>
          実装: 親が押されたボタンの座標 (x, y) を渡して Fx を 1 回マウント。
        </div>

        <div style={{ position: 'relative' }}>
          <UpgradeCard
            title="最大 HP"
            iconName="heart"
            currentLabel="Lv 4"
            before={1200}
            after={1320}
            currency="bolt"
            accent="primary"
            options={[
              { amount: '+1',  cost: 80,  onClick: () => setFx((s) => [...s, { id: Date.now(), x: 18, y: 80 }]) },
              { amount: '+5',  cost: 380, onClick: () => setFx((s) => [...s, { id: Date.now(), x: 50, y: 80 }]) },
              { amount: 'MAX', cost: 720, onClick: () => setFx((s) => [...s, { id: Date.now(), x: 82, y: 80 }]) },
            ]}
          />
          {fx.map((f) => (
            <LevelUpFx key={f.id} x={f.x} y={f.y} onDone={() => setFx((s) => s.filter((x) => x.id !== f.id))} />
          ))}
        </div>

        <div className="sub" style={{ marginTop: 8 }}>↑ +1 / +5 ボタンをタップして発火</div>

        <h2 style={{ fontFamily: 'var(--ff-display)', fontSize: 12, color: 'var(--c-primary)', margin: '8px 0 4px', letterSpacing: '.08em' }}>素体プレビュー (背景なし)</h2>
        <div className="demo-area" style={{ position: 'relative', height: 120, background: 'var(--c-bg-base)', border: '1px solid var(--c-border-faint)', borderRadius: 8 }}>
          <LevelUpFx key={fx.length} x={50} y={50} />
        </div>
        <button className="btn" onClick={() => setFx([...fx])}>再生</button>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script></body></html>
