<!-- @dsCard group="Atoms" viewport="720x1100" name="Icon" subtitle="currency / weapon / ui / game — 30 アイコン" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — Icon</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  h2.purple { color: var(--c-secondary); }
  h2.purple::before { background: var(--c-secondary); box-shadow: var(--glow-purple-sm); }
  h2.warn { color: var(--c-warning); }
  h2.warn::before { background: var(--c-warning); box-shadow: 0 0 6px rgba(246,185,74,0.55); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .cell {
    background: var(--c-bg-base);
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-s);
    padding: 14px 8px 8px;
    display: grid; gap: 8px; justify-items: center;
    color: var(--c-text);
    min-height: 84px;
  }
  .cell .lbl {
    font-family: var(--ff-numeric); font-size: 9.5px; color: var(--c-text-dim);
    letter-spacing: var(--ls-num); text-align: center;
  }
  .size-row {
    display: grid; grid-template-columns: 80px 1fr;
    gap: 14px; padding: 10px 0; align-items: center;
    border-top: 1px dashed var(--c-border-faint);
  }
  .size-row:first-of-type { border-top: 0; padding-top: 4px; }
  .size-row .name { font-family: var(--ff-numeric); font-size: 11px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
  .size-row .stack { display: inline-flex; gap: 16px; align-items: baseline; color: var(--c-primary); }
  .note { font-size: 11px; color: var(--c-text-dim); margin-top: 10px; line-height: 1.6; }
  .note code { font-family: var(--ff-numeric); color: var(--c-primary); background: var(--c-bg-base); padding: 1px 5px; border-radius: var(--r-xs); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { Icon } = window.TowerLikeGame_28197d;

  const currencyNames = ['screw', 'bolt', 'alloy'];
  const weaponNames = ['laser', 'cannon', 'thunder', 'cutter'];
  const uiNames = ['close', 'menu', 'settings', 'play', 'pause', 'chevron-right', 'chevron-left', 'chevron-down', 'chevron-up', 'plus', 'minus', 'check', 'info', 'arrow-up'];
  const gameNames = ['tower', 'shield', 'heart', 'flame', 'ice', 'lightning', 'skull', 'spark', 'target'];

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>ICON</h1>
          <div className="sub">
            currency / weapon は画像生成 AI 製の SVG を <code>assets/icons/</code> に配置、Icon コンポーネント側で <code>inline-svg</code> kind として埋め込み。UI / game は本体 JSX 内のジオメトリック合成。
          </div>
        </header>

        <section>
          <h2>Currency ({currencyNames.length})</h2>
          <div className="grid" style={{ gridTemplateColumns: 'repeat(3, 1fr)' }}>
            {currencyNames.map((n) => (
              <div className="cell" key={n} style={{ color: 'var(--c-primary)' }}>
                <Icon name={n} size={40} />
                <div className="lbl">{n}</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2 className="warn">Weapon ({weaponNames.length})</h2>
          <div className="grid" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
            {weaponNames.map((n) => (
              <div className="cell" key={n} style={{ color: 'var(--c-warning)' }}>
                <Icon name={n} size={40} />
                <div className="lbl">{n}</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2>UI ({uiNames.length})</h2>
          <div className="grid">
            {uiNames.map((n) => (
              <div className="cell" key={n} style={{ color: 'var(--c-text-mid)' }}>
                <Icon name={n} size={28} />
                <div className="lbl">{n}</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2 className="purple">Game ({gameNames.length})</h2>
          <div className="grid">
            {gameNames.map((n) => (
              <div className="cell" key={n} style={{ color: 'var(--c-secondary)' }}>
                <Icon name={n} size={28} />
                <div className="lbl">{n}</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2>size scale</h2>
          <div className="size-row"><div className="name">14 px</div><div className="stack">
            <Icon name="screw" size={14} /><Icon name="bolt" size={14} /><Icon name="alloy" size={14} /><Icon name="laser" size={14} /><Icon name="cannon" size={14} /><Icon name="thunder" size={14} /><Icon name="cutter" size={14} />
          </div></div>
          <div className="size-row"><div className="name">20 px</div><div className="stack">
            <Icon name="screw" size={20} /><Icon name="bolt" size={20} /><Icon name="alloy" size={20} /><Icon name="laser" size={20} /><Icon name="cannon" size={20} /><Icon name="thunder" size={20} /><Icon name="cutter" size={20} />
          </div></div>
          <div className="size-row"><div className="name">28 px</div><div className="stack">
            <Icon name="screw" size={28} /><Icon name="bolt" size={28} /><Icon name="alloy" size={28} /><Icon name="laser" size={28} /><Icon name="cannon" size={28} /><Icon name="thunder" size={28} /><Icon name="cutter" size={28} />
          </div></div>
          <div className="size-row"><div className="name">40 px</div><div className="stack">
            <Icon name="screw" size={40} /><Icon name="bolt" size={40} /><Icon name="alloy" size={40} /><Icon name="laser" size={40} /><Icon name="cannon" size={40} /><Icon name="thunder" size={40} /><Icon name="cutter" size={40} />
          </div></div>
        </section>

        <section>
          <h2>color (currentColor)</h2>
          <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', alignItems: 'center' }}>
            <span style={{ color: 'var(--c-primary)'   }}><Icon name="bolt" size={36} /></span>
            <span style={{ color: 'var(--c-secondary)' }}><Icon name="bolt" size={36} /></span>
            <span style={{ color: 'var(--c-danger)'    }}><Icon name="bolt" size={36} /></span>
            <span style={{ color: 'var(--c-success)'   }}><Icon name="bolt" size={36} /></span>
            <span style={{ color: 'var(--c-warning)'   }}><Icon name="bolt" size={36} /></span>
            <span style={{ color: 'var(--c-text-dim)'  }}><Icon name="bolt" size={36} /></span>
          </div>
          <div className="note">
            親要素の <code>color</code> から <code>currentColor</code> 経由で fill / stroke を継承。
            親で <code>filter: drop-shadow</code> や <code>--glow-*</code> を付与しても OK。
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
