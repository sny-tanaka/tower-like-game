<!-- @dsCard group="Atoms" viewport="720x900" name="Tab" subtitle="underline / pill × active / badge / disabled" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — Tab</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }

  .tabbar {
    display: flex; align-items: stretch;
    background: var(--c-bg-base);
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
  }
  .pillbar { display: inline-flex; gap: 8px; flex-wrap: wrap; padding: 6px; background: var(--c-bg-base); border-radius: var(--r-pill); border: 1px solid var(--c-border-faint); }
  .info { font-size: 11px; color: var(--c-text-dim); margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { Tab, Icon } = window.TowerLikeGame_28197d;

  function Page() {
    const [machineTab, setMachineTab] = React.useState('defense');
    const [armoryTab, setArmoryTab] = React.useState('laser');

    return (
      <div className="page">
        <header>
          <h1>TAB</h1>
          <div className="sub">TabBar Molecule の構成要素。1 枚 = 1 タブ、active は外から渡す。</div>
        </header>

        <section>
          <h2>underline — マシン強化画面の 5 タブ</h2>
          <div className="tabbar">
            <Tab label="防御"     active={machineTab==='defense'}  onClick={() => setMachineTab('defense')} />
            <Tab label="攻撃"     active={machineTab==='attack'}   onClick={() => setMachineTab('attack')} />
            <Tab label="アクティブ" active={machineTab==='active'}   onClick={() => setMachineTab('active')} />
            <Tab label="経済"     active={machineTab==='economy'}  onClick={() => setMachineTab('economy')} />
            <Tab label="スロット" active={machineTab==='slot'}     onClick={() => setMachineTab('slot')} />
          </div>
          <div className="info">selected: {machineTab}</div>
        </section>

        <section>
          <h2>underline + icon — 武器庫</h2>
          <div className="tabbar">
            <Tab label="LASER"   active={armoryTab==='laser'}   onClick={() => setArmoryTab('laser')}   iconLeft={<Icon name="laser" size={14} />} />
            <Tab label="CANNON"  active={armoryTab==='cannon'}  onClick={() => setArmoryTab('cannon')}  iconLeft={<Icon name="cannon" size={14} />} />
            <Tab label="THUNDER" active={armoryTab==='thunder'} onClick={() => setArmoryTab('thunder')} iconLeft={<Icon name="thunder" size={14} />} />
            <Tab label="CUTTER"  active={armoryTab==='cutter'}  onClick={() => setArmoryTab('cutter')}  iconLeft={<Icon name="cutter" size={14} />} />
          </div>
          <div className="info">selected: {armoryTab}</div>
        </section>

        <section>
          <h2>underline + badge — パッチ庫</h2>
          <div className="tabbar">
            <Tab label="装着"   active={true}  badge="6/8" />
            <Tab label="所持"   active={false} badge={42} />
            <Tab label="合成"   active={false} badge="!" />
          </div>
        </section>

        <section>
          <h2>pill — セグメント切替</h2>
          <div className="pillbar">
            <Tab label="×1"  variant="pill" size="sm" active={true} />
            <Tab label="×2"  variant="pill" size="sm" />
            <Tab label="×4"  variant="pill" size="sm" />
            <Tab label="×8"  variant="pill" size="sm" />
          </div>
        </section>

        <section>
          <h2>disabled</h2>
          <div className="tabbar">
            <Tab label="開放済み" active={true} />
            <Tab label="ロック中" disabled />
            <Tab label="ロック中" disabled />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
