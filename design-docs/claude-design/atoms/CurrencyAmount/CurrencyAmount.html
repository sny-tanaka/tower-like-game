<!-- @dsCard group="Atoms" viewport="720x900" name="CurrencyAmount" subtitle="screw / bolt / alloy + 値 (Icon + NumericDisplay)" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — CurrencyAmount</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { background: var(--c-bg-base); border: 1px solid var(--c-border-faint); border-radius: var(--r-s); padding: 14px 12px; display: grid; gap: 8px; align-items: center; justify-items: center; min-height: 76px; }
  .lbl { font-family: var(--ff-numeric); font-size: 9.5px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
  .row { display: grid; grid-template-columns: 90px 1fr 160px; gap: 14px; padding: 12px 0; align-items: center; border-top: 1px dashed var(--c-border-faint); }
  .row:first-of-type { border-top: 0; padding-top: 4px; }
  .name { font-family: var(--ff-numeric); font-size: 10.5px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
  .meta { font-family: var(--ff-numeric); font-size: 10px; color: var(--c-text-dim); text-align: right; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { CurrencyAmount } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>CURRENCY AMOUNT</h1>
          <div className="sub">Icon (currency) + NumericDisplay。アイコン色は通貨ごとに自動。</div>
        </header>

        <section>
          <h2>currency × size</h2>
          <div className="row"><div className="name">screw · sm</div><CurrencyAmount currency="screw" value={4280} size="sm" /><div className="meta">ラン中 · インライン</div></div>
          <div className="row"><div className="name">screw · md</div><CurrencyAmount currency="screw" value={4280} size="md" /><div className="meta">カード</div></div>
          <div className="row"><div className="name">bolt · md</div><CurrencyAmount currency="bolt" value={1234567} size="md" /><div className="meta">永続強化 HUD</div></div>
          <div className="row"><div className="name">alloy · md</div><CurrencyAmount currency="alloy" value={845} size="md" /><div className="meta">武器強化</div></div>
          <div className="row"><div className="name">bolt · lg</div><CurrencyAmount currency="bolt" value={1.23e9} size="lg" /><div className="meta">Result ダイアログ</div></div>
        </section>

        <section>
          <h2>delta (+/-)</h2>
          <div className="grid-3">
            <div className="cell">
              <CurrencyAmount currency="screw" value={120} delta="+" size="md" />
              <div className="lbl">screw 獲得</div>
            </div>
            <div className="cell">
              <CurrencyAmount currency="bolt" value={45} delta="+" size="md" />
              <div className="lbl">bolt 獲得</div>
            </div>
            <div className="cell">
              <CurrencyAmount currency="alloy" value={2} delta="+" size="md" />
              <div className="lbl">alloy ドロップ</div>
            </div>
            <div className="cell">
              <CurrencyAmount currency="screw" value={500} delta="-" size="md" />
              <div className="lbl">強化コスト</div>
            </div>
            <div className="cell">
              <CurrencyAmount currency="bolt" value={1200} delta="-" size="md" />
              <div className="lbl">恒久強化</div>
            </div>
            <div className="cell">
              <CurrencyAmount currency="alloy" value={5} delta="-" size="md" />
              <div className="lbl">武器強化</div>
            </div>
          </div>
        </section>

        <section>
          <h2>showLabel</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <CurrencyAmount currency="screw" value={4280} size="md" showLabel />
            <CurrencyAmount currency="bolt" value={1234567} size="md" showLabel />
            <CurrencyAmount currency="alloy" value={12} size="md" showLabel />
          </div>
        </section>

        <section>
          <h2>subtle (購入不可・条件未達)</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <CurrencyAmount currency="screw" value={9999} size="md" subtle />
            <CurrencyAmount currency="bolt" value={42} size="md" subtle />
            <CurrencyAmount currency="alloy" value={1} size="md" subtle />
          </div>
        </section>

        <section>
          <h2>align=end (右配置 / 数値先行)</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <CurrencyAmount currency="screw" value={4280} size="md" align="end" />
            <CurrencyAmount currency="bolt" value={1234567} size="md" align="end" />
            <CurrencyAmount currency="alloy" value={12} size="md" align="end" />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
