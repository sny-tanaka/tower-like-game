<!-- @dsCard group="Atoms" viewport="412x900" name="Card" subtitle="default / elevated / sunken / accent / secondary / danger / ghost" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — Card</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stack { display: grid; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { Card, Text } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>CARD</h1>
          <div className="sub">汎用カード。7 variant × 5 padding × 3 radius。</div>
        </header>

        <section>
          <h2>variant</h2>
          <div className="col2">
            <Card variant="default"><Text variant="label" color="dim">default</Text></Card>
            <Card variant="elevated"><Text variant="label" color="dim">elevated</Text></Card>
            <Card variant="sunken"><Text variant="label" color="dim">sunken</Text></Card>
            <Card variant="ghost"><Text variant="label" color="dim">ghost</Text></Card>
            <Card variant="accent"><Text variant="label" color="primary">accent</Text></Card>
            <Card variant="secondary"><Text variant="label" color="secondary">secondary</Text></Card>
            <Card variant="danger"><Text variant="label" color="danger">danger</Text></Card>
          </div>
        </section>

        <section>
          <h2>padding (sm / md / lg / xl)</h2>
          <div className="stack">
            <Card padding="sm"><Text variant="caption" color="dim">padding: sm (8px)</Text></Card>
            <Card padding="md"><Text variant="caption" color="dim">padding: md (12px)</Text></Card>
            <Card padding="lg"><Text variant="caption" color="dim">padding: lg (16px)</Text></Card>
            <Card padding="xl"><Text variant="caption" color="dim">padding: xl (20px)</Text></Card>
          </div>
        </section>

        <section>
          <h2>radius</h2>
          <div className="col2">
            <Card radius="sm" padding="lg"><Text variant="label" color="dim">radius: sm</Text></Card>
            <Card radius="md" padding="lg"><Text variant="label" color="dim">radius: md</Text></Card>
            <Card radius="l"  padding="lg"><Text variant="label" color="dim">radius: l</Text></Card>
          </div>
        </section>

        <section>
          <h2>nested (sunken inside default)</h2>
          <Card padding="lg">
            <Text variant="heading-3" color="text" style={{ fontSize: 14, marginBottom: 10 }}>外側カード</Text>
            <Card variant="sunken" padding="md">
              <Text variant="caption" color="mid">内側 sunken — リスト項目背景などに</Text>
            </Card>
          </Card>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
