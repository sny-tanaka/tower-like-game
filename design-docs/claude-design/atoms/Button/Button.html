<!-- @dsCard group="Atoms" viewport="720x900" name="Button" subtitle="primary / secondary / danger / ghost × sm / md / lg" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — Button</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }

  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 {
    font-family: var(--ff-display); font-weight: 600;
    font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase;
    color: var(--c-primary); margin: 0 0 14px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stack { display: grid; gap: 12px; }
  .label-l {
    font-family: var(--ff-numeric); font-size: 10px; color: var(--c-text-dim);
    letter-spacing: var(--ls-num); width: 70px;
  }
  .group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { Button, Icon } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>BUTTON</h1>
          <div className="sub">primary は最重要動線、secondary は並列選択、danger は破壊的、ghost は副動線。</div>
        </header>

        <section>
          <h2>variant × md</h2>
          <div className="row">
            <Button label="出撃" variant="primary" />
            <Button label="切替" variant="secondary" />
            <Button label="撤退" variant="danger" />
            <Button label="戻る" variant="ghost" />
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div className="stack">
            <div className="group"><span className="label-l">sm 32</span>
              <Button label="購入" size="sm" variant="primary" />
              <Button label="購入" size="sm" variant="secondary" />
              <Button label="リセット" size="sm" variant="danger" />
              <Button label="閉じる" size="sm" variant="ghost" />
            </div>
            <div className="group"><span className="label-l">md 40</span>
              <Button label="購入" size="md" variant="primary" />
              <Button label="購入" size="md" variant="secondary" />
              <Button label="リセット" size="md" variant="danger" />
              <Button label="閉じる" size="md" variant="ghost" />
            </div>
            <div className="group"><span className="label-l">lg 48</span>
              <Button label="出撃" size="lg" variant="primary" />
              <Button label="武器選択" size="lg" variant="secondary" />
              <Button label="撤退する" size="lg" variant="danger" />
              <Button label="キャンセル" size="lg" variant="ghost" />
            </div>
          </div>
        </section>

        <section>
          <h2>icon + label</h2>
          <div className="row">
            <Button label="購入" variant="primary" iconLeft={<Icon name="plus" size={16} />} />
            <Button label="武器切替" variant="secondary" iconLeft={<Icon name="laser" size={16} />} />
            <Button label="設定" variant="ghost" iconLeft={<Icon name="settings" size={16} />} />
            <Button label="次へ" variant="ghost" iconRight={<Icon name="chevron-right" size={16} />} />
          </div>
        </section>

        <section>
          <h2>fullWidth (lg)</h2>
          <div className="stack">
            <Button label="出撃する" size="lg" variant="primary" fullWidth />
            <Button label="武器庫を開く" size="lg" variant="secondary" fullWidth iconLeft={<Icon name="thunder" size={18} />} />
            <Button label="ラン破棄して撤退" size="lg" variant="danger" fullWidth />
          </div>
        </section>

        <section>
          <h2>disabled</h2>
          <div className="row">
            <Button label="購入" variant="primary" disabled />
            <Button label="切替" variant="secondary" disabled />
            <Button label="撤退" variant="danger" disabled />
            <Button label="戻る" variant="ghost" disabled />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
