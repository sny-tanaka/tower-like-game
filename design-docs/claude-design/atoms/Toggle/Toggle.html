<!-- @dsCard group="Atoms" viewport="412x800" name="Toggle" subtitle="ON / OFF スイッチ × accent × size × ラベル付き" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><title>Atom — Toggle</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--c-border-faint); }
  .row:first-child { border-top: 0; padding-top: 0; }
</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { Toggle } = window.TowerLikeGame_28197d;
  function Page() {
    const [a, setA] = React.useState(true);
    const [b, setB] = React.useState(false);
    const [c, setC] = React.useState(true);
    return (
      <div className="page">
        <header><h1>TOGGLE</h1><div className="sub">ON/OFF。設定画面 / アクティブモード切替などで使用。</div></header>
        <section>
          <h2>state × accent (md)</h2>
          <div className="row"><Toggle checked={a} onChange={setA} accent="primary" /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>primary · {String(a)}</span></div>
          <div className="row"><Toggle checked={b} onChange={setB} accent="secondary" /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>secondary · {String(b)}</span></div>
          <div className="row"><Toggle checked={c} onChange={setC} accent="success" /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>success · {String(c)}</span></div>
          <div className="row"><Toggle checked disabled /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>disabled on</span></div>
          <div className="row"><Toggle disabled /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>disabled off</span></div>
        </section>
        <section>
          <h2>size</h2>
          <div className="row"><Toggle checked size="sm" /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>sm</span></div>
          <div className="row"><Toggle checked size="md" /><span style={{fontSize:11,color:'var(--c-text-dim)'}}>md (default)</span></div>
        </section>
        <section>
          <h2>label + description</h2>
          <Toggle checked label="バイブレーション" description="ヒット時の振動フィードバック" accent="primary" />
          <div style={{ height: 8 }} />
          <Toggle label="アクティブ自動発動" description="CD 明けで自動発動 (バトル中の挙動)" accent="secondary" />
        </section>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script></body></html>
