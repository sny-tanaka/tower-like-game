<!-- @dsCard group="Atoms" viewport="720x900" name="CircularProgress" subtitle="武器 CD / Wave 等の円弧プログレス" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — CircularProgress</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { background: var(--c-bg-base); border: 1px solid var(--c-border-faint); border-radius: var(--r-s); padding: 16px 8px 10px; display: grid; gap: 10px; align-items: center; justify-items: center; min-height: 86px; }
  .lbl { font-family: var(--ff-numeric); font-size: 9.5px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { CircularProgress, Icon } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>CIRCULAR PROGRESS</h1>
          <div className="sub">武器 CD / アクティブクールダウン / 一時的なゲージ。中央に label・children を表示可。</div>
        </header>

        <section>
          <h2>progress (color=cd)</h2>
          <div className="grid-6">
            {[0, 20, 40, 60, 80, 100].map((v) => (
              <div className="cell" key={v}>
                <CircularProgress value={v} size={40} thickness={4} color="cd" />
                <div className="lbl">{v}%</div>
              </div>
            ))}
          </div>
        </section>

        <section>
          <h2>color</h2>
          <div className="grid-4">
            <div className="cell"><CircularProgress value={62} size={40} thickness={4} color="cd" glow /><div className="lbl">cd</div></div>
            <div className="cell"><CircularProgress value={62} size={40} thickness={4} color="wave" glow /><div className="lbl">wave</div></div>
            <div className="cell"><CircularProgress value={62} size={40} thickness={4} color="hp" /><div className="lbl">hp</div></div>
            <div className="cell"><CircularProgress value={62} size={40} thickness={4} color="warning" /><div className="lbl">warning</div></div>
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div className="grid-4">
            <div className="cell"><CircularProgress value={62} size={20} thickness={2} color="cd" /><div className="lbl">20</div></div>
            <div className="cell"><CircularProgress value={62} size={32} thickness={3} color="cd" /><div className="lbl">32</div></div>
            <div className="cell"><CircularProgress value={62} size={48} thickness={4} color="cd" /><div className="lbl">48</div></div>
            <div className="cell"><CircularProgress value={62} size={64} thickness={5} color="cd" /><div className="lbl">64</div></div>
          </div>
        </section>

        <section>
          <h2>with label / children</h2>
          <div className="grid-4">
            <div className="cell">
              <CircularProgress value={62} size={48} thickness={4} color="cd" showLabel glow />
              <div className="lbl">% (default)</div>
            </div>
            <div className="cell">
              <CircularProgress value={62} size={48} thickness={4} color="cd" showLabel label="2.4s" glow />
              <div className="lbl">label</div>
            </div>
            <div className="cell">
              <CircularProgress value={62} size={56} thickness={4} color="cd" glow>
                <span style={{ color: 'var(--c-primary)' }}>
                  <Icon name="laser" size={24} />
                </span>
              </CircularProgress>
              <div className="lbl">children (Icon)</div>
            </div>
            <div className="cell">
              <CircularProgress value={45} size={56} thickness={4} color="wave" glow>
                <span style={{ fontFamily: 'var(--ff-numeric)', fontSize: 11, fontWeight: 600, color: 'var(--c-secondary)' }}>W17</span>
              </CircularProgress>
              <div className="lbl">Wave</div>
            </div>
          </div>
        </section>

        <section>
          <h2>武器スロット 4 枚 (CD 異なる)</h2>
          <div style={{ display: 'flex', gap: 16, justifyContent: 'center' }}>
            {[
              { name: 'laser', cd: 100, active: true },
              { name: 'cannon', cd: 35, active: false },
              { name: 'thunder', cd: 70, active: false },
              { name: 'cutter', cd: 12, active: false },
            ].map((w) => (
              <CircularProgress key={w.name} value={w.cd} size={52} thickness={3} color="cd" glow={w.active}>
                <span style={{
                  color: w.cd >= 100 ? 'var(--c-primary)' : 'var(--c-text-dim)',
                  filter: w.cd >= 100 ? 'drop-shadow(var(--glow-cyan-sm))' : 'none',
                }}>
                  <Icon name={w.name} size={26} />
                </span>
              </CircularProgress>
            ))}
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
