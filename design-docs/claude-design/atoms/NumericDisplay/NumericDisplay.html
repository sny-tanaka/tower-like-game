<!-- @dsCard group="Atoms" viewport="720x900" name="NumericDisplay" subtitle="A→Z→AA→… の無限スケール / accent / size / glow" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Atom — NumericDisplay</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell {
    background: var(--c-bg-base);
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-s);
    padding: 14px 10px;
    text-align: center;
    display: grid; gap: 8px; align-items: center; justify-items: center;
    min-height: 76px;
  }
  .raw { font-family: var(--ff-numeric); font-size: 9.5px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
  .axis-row { display: grid; grid-template-columns: 90px 1fr 80px; gap: 14px; padding: 10px 0; border-top: 1px dashed var(--c-border-faint); align-items: center; }
  .axis-row:first-of-type { border-top: 0; }
  .axis-label { font-family: var(--ff-numeric); font-size: 11px; color: var(--c-text-dim); letter-spacing: var(--ls-num); }
  .axis-meta { font-family: var(--ff-numeric); font-size: 10px; color: var(--c-text-dim); text-align: right; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { NumericDisplay } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>NUMERIC DISPLAY</h1>
          <div className="sub">1,000 以上は 1.23 × 10³ⁿ を仮数部 + アルファベット (A→Z→AA→…) に変換。</div>
        </header>

        <section>
          <h2>無限スケール表記 · 桁数ごとに色相推移 (cyan → purple)</h2>
          <div className="grid-4">
            <div className="cell">
              <NumericDisplay value={87} size="lg" glow />
              <div className="raw">raw 87 · e=0</div>
            </div>
            <div className="cell">
              <NumericDisplay value={1234} size="lg" glow />
              <div className="raw">10³ → A · e=1</div>
            </div>
            <div className="cell">
              <NumericDisplay value={45_600_000} size="lg" glow />
              <div className="raw">10⁶ → B · e=2</div>
            </div>
            <div className="cell">
              <NumericDisplay value={7.8e9} size="lg" glow />
              <div className="raw">10⁹ → C · e=3</div>
            </div>
            <div className="cell">
              <NumericDisplay value={5.5e12} size="lg" glow />
              <div className="raw">10¹² → D · e=4</div>
            </div>
            <div className="cell">
              <NumericDisplay value={3.2e15} size="lg" glow />
              <div className="raw">10¹⁵ → E · e=5</div>
            </div>
            <div className="cell">
              <NumericDisplay value={9.1e18} size="lg" glow />
              <div className="raw">10¹⁸ → F · e=6</div>
            </div>
            <div className="cell">
              <NumericDisplay value={4.2e24} size="lg" glow />
              <div className="raw">10²⁴ → H · e=8</div>
            </div>
            <div className="cell">
              <NumericDisplay value={1.23e30} size="lg" glow />
              <div className="raw">10³⁰ → J · e=10</div>
            </div>
            <div className="cell">
              <NumericDisplay value={6.4e42} size="lg" glow />
              <div className="raw">10⁴² → N · e=14</div>
            </div>
            <div className="cell">
              <NumericDisplay value={5e60} size="lg" glow />
              <div className="raw">10⁶⁰ → T · e=20</div>
            </div>
            <div className="cell">
              <NumericDisplay value={3.14e78} size="lg" glow />
              <div className="raw">10⁷⁸ → Z · e=26 (飽和)</div>
            </div>
          </div>
        </section>

        <section>
          <h2>size scale (default = 'scale' accent)</h2>
          <div className="axis-row">
            <div className="axis-label">sm 13</div>
            <NumericDisplay value={1234567} size="sm" />
            <div className="axis-meta">inline / 説明文</div>
          </div>
          <div className="axis-row">
            <div className="axis-label">md 18</div>
            <NumericDisplay value={1234567} size="md" />
            <div className="axis-meta">cards · costs</div>
          </div>
          <div className="axis-row">
            <div className="axis-label">lg 28</div>
            <NumericDisplay value={1234567} size="lg" glow />
            <div className="axis-meta">HUD / HP</div>
          </div>
          <div className="axis-row">
            <div className="axis-label">xl 36</div>
            <NumericDisplay value={1234567} size="xl" glow />
            <div className="axis-meta">獲得演出 / Result</div>
          </div>
        </section>

        <section>
          <h2>accent override (明示指定したときだけ scale を上書き)</h2>
          <div className="grid-3">
            <div className="cell">
              <NumericDisplay value={1.4} decimals={1} prefix="×" size="lg" accentColor="primary" glow />
              <div className="raw">primary・倍率</div>
            </div>
            <div className="cell">
              <NumericDisplay value={12} prefix="+" size="lg" accentColor="success" glow />
              <div className="raw">success・回復</div>
            </div>
            <div className="cell">
              <NumericDisplay value={4500} size="lg" accentColor="danger" glow />
              <div className="raw">danger・被ダメ</div>
            </div>
            <div className="cell">
              <NumericDisplay value={234} prefix="-" size="lg" accentColor="warning" glow />
              <div className="raw">warning・CD 短縮</div>
            </div>
            <div className="cell">
              <NumericDisplay value={17} suffix=" Wave" size="lg" accentColor="secondary" glow />
              <div className="raw">secondary・進行</div>
            </div>
            <div className="cell">
              <NumericDisplay value={99} suffix="%" size="lg" accentColor="dim" />
              <div className="raw">dim・非アクティブ</div>
            </div>
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
