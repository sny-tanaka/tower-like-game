<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — BattleHudTop</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .frame {
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    background: var(--c-bg-deep);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { BattleHudTop } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>BATTLE HUD TOP</h1>
          <div className="sub">Tier + HP + Wave + マイルストーン (ボス予告など)。Sticky 想定。</div>
        </header>

        <div className="lbl">通常状態 (Tier 5 / HP 78%)</div>
        <div className="frame">
          <BattleHudTop
            tier={5}
            hp={{ current: 7847, max: 10000 }}
            wave={{ number: 12, secondsLeft: 18, secondsMax: 26 }}
          />
        </div>

        <div className="lbl">エリート予告 (次 Wave エリート)</div>
        <div className="frame">
          <BattleHudTop
            tier={5}
            hp={{ current: 6200, max: 10000 }}
            wave={{ number: 4, secondsLeft: 10, secondsMax: 26, nextMilestone: { wave: 5, kind: 'elite' } }}
          />
        </div>

        <div className="lbl">ボス予告 (Tier 10 ボス Wave 直前)</div>
        <div className="frame">
          <BattleHudTop
            tier={10}
            hp={{ current: 4_500_000, max: 8_000_000 }}
            wave={{ number: 19, secondsLeft: 4, secondsMax: 26, nextMilestone: { wave: 20, kind: 'boss' } }}
          />
        </div>

        <div className="lbl">低 HP + damaging フラッシュ</div>
        <div className="frame">
          <BattleHudTop
            tier={7}
            hp={{ current: 1800, max: 10000 }}
            wave={{ number: 8, secondsLeft: 12, secondsMax: 26 }}
            damaging
          />
        </div>

        <div className="lbl">シールドあり</div>
        <div className="frame">
          <BattleHudTop
            tier={5}
            hp={{ current: 7847, max: 10000 }}
            shield={{ current: 1200, max: 2000 }}
            wave={{ number: 12, secondsLeft: 18, secondsMax: 26 }}
          />
        </div>

        <div className="lbl">高 Tier (無限スケール表記)</div>
        <div className="frame">
          <BattleHudTop
            tier={12}
            hp={{ current: 150.5e6, max: 200e6 }}
            wave={{ number: 27, secondsLeft: 8, secondsMax: 26, nextMilestone: { wave: 30, kind: 'tier-up' } }}
          />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
