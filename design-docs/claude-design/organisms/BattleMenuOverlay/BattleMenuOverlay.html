<!-- @dsCard group="Organisms" viewport="412x900" name="BattleMenuOverlay" subtitle="撤退 + アクティブ手動/自動 + BGM/SE 簡易音量" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — BattleMenuOverlay</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 0; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .stage {
    position: relative;
    height: 480px;
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, rgba(78,228,246,0.06) 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      var(--c-bg-base);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { BattleMenuOverlay } = window.TowerLikeGame_28197d;

  function Page() {
    const [open, setOpen] = React.useState(true);
    const [bgm, setBgm] = React.useState(80);
    const [se, setSe] = React.useState(70);

    return (
      <div className="page">
        <header>
          <h1>BATTLE MENU OVERLAY</h1>
          <div className="sub">バトル中の中断メニュー。撤退 / アクティブ手動自動 / 簡易音量。</div>
        </header>

        <div className="stage">
          <BattleMenuOverlay
            open={open}
            onClose={() => setOpen(false)}
            onRetreat={() => alert('撤退確認 → ConfirmDialog')}
            bgm={bgm} se={se}
            onBgmChange={setBgm} onSeChange={setSe}
          />
          {!open && (
            <button
              onClick={() => setOpen(true)}
              style={{
                position: 'absolute', top: 12, right: 12,
                fontFamily: 'var(--ff-display)', fontSize: 11, fontWeight: 600,
                letterSpacing: 'var(--ls-loose)', textTransform: 'uppercase',
                background: 'var(--c-bg-elev)', border: '1px solid var(--c-primary)',
                color: 'var(--c-primary)', padding: '6px 12px', borderRadius: 'var(--r-s)',
                cursor: 'pointer',
              }}
            >再表示</button>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
