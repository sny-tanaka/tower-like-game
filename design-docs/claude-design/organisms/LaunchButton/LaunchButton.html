<!-- @dsCard group="Organisms" viewport="412x600" name="LaunchButton" subtitle="出撃準備のフッタ。Tier + 武器 + パッチ数 + 出撃 lg" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — LaunchButton</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .frame { border: 1px solid var(--c-border-faint); border-radius: var(--r-m); overflow: hidden; background: var(--c-bg-base); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { LaunchButton } = window.TowerLikeGame_28197d;
  function Page() {
    return (
      <div className="page">
        <header><h1>LAUNCH BUTTON</h1><div className="sub">出撃準備画面のフッタ。Tier + 武器 + パッチ数 + lg 出撃ボタン。</div></header>
        <div className="lbl">標準</div>
        <div className="frame"><LaunchButton tier={7} weaponKind="laser" patchCount={4} sticky={false} onLaunch={() => alert('出撃')} /></div>
        <div className="lbl">高 Tier + cutter + 満載</div>
        <div className="frame"><LaunchButton tier={12} weaponKind="cutter" patchCount={8} sticky={false} /></div>
        <div className="lbl">disabled</div>
        <div className="frame"><LaunchButton tier={1} weaponKind="cannon" patchCount={0} sticky={false} disabled /></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
