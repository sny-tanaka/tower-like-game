<!-- @dsCard group="Organisms" viewport="412x900" name="EquippedPatchesTab" subtitle="装着パッチの読み取り専用一覧 + 装備変更導線" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — EquippedPatchesTab</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { EquippedPatchesTab } = window.TowerLikeGame_28197d;
  const patches = [
    { patchId: 'p1', name: '装甲補強',   iconName: 'shield',    tier: 1, trigger: '常時',      effect: '被ダメ -5%',   count: 4 },
    { patchId: 'p2', name: '氷結トリガー', iconName: 'ice',       tier: 2, trigger: 'クリ時',    effect: '2 秒凍結',     count: 2 },
    { patchId: 'p3', name: '瞬殺装甲',     iconName: 'skull',     tier: 3, trigger: 'HP25%↓',    effect: '敵を即死',     count: 1 },
    { patchId: 'p4', name: '連鎖燃焼',     iconName: 'flame',     tier: 4, trigger: '貫通時',    effect: '周囲焼夷',     count: 1 },
  ];
  function Page() {
    return (
      <div className="page">
        <header><h1>EQUIPPED PATCHES TAB</h1><div className="sub">出撃前に装着状況を確認。編集はパッチ庫へ。</div></header>
        <section><h2>装着あり (4/8)</h2><EquippedPatchesTab patches={patches} slotCount={8} onOpenPatchScreen={() => alert('パッチ庫遷移')} /></section>
        <section><h2>満載 + ロック (8/8 +2)</h2><EquippedPatchesTab patches={[...patches, ...patches]} slotCount={8} lockedCount={2} onOpenPatchScreen={() => {}} /></section>
        <section><h2>未装着</h2><EquippedPatchesTab patches={[]} slotCount={8} onOpenPatchScreen={() => {}} /></section>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
