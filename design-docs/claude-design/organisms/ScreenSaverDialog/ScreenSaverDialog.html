<!-- @dsCard group="Organisms" viewport="412x900" name="ScreenSaverDialog" subtitle="焼き付き防止ドリフト · 文字がたまに別位置に出る" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — ScreenSaverDialog</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 0; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stage {
    position: relative;
    height: 500px;
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, rgba(78,228,246,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      var(--c-bg-base);
  }
  .reopen {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--ff-display); font-size: 11px; font-weight: 600;
    letter-spacing: var(--ls-loose); text-transform: uppercase;
    background: var(--c-bg-elev); border: 1px solid var(--c-primary);
    color: var(--c-primary); padding: 6px 12px; border-radius: var(--r-s);
    cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { ScreenSaverDialog } = window.TowerLikeGame_28197d;

  function Page() {
    const [open, setOpen] = React.useState(true);
    return (
      <div className="page">
        <header>
          <h1>SCREEN SAVER DIALOG</h1>
          <div className="sub">焼き付き防止 — 何も常時表示せず、文字がたまに別位置に現れて消える。</div>
        </header>

        <div className="lbl">標準 (Tier 5 / Wave 12 / HP 78%)</div>
        <div className="stage">
          <ScreenSaverDialog open={open} onDismiss={() => setOpen(false)} stats={{ tier: 5, wave: 12, hpPct: 78 }} />
          {!open && <button className="reopen" onClick={() => setOpen(true)}>再起動</button>}
        </div>

        <div className="lbl">低 HP (危険レベル)</div>
        <div className="stage">
          <ScreenSaverDialog open stats={{ tier: 9, wave: 26, hpPct: 18 }} />
        </div>

        <div className="lbl">stats なし (最小)</div>
        <div className="stage">
          <ScreenSaverDialog open />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
