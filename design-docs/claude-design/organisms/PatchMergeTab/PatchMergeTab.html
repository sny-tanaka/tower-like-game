<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8" /><title>Organism — PatchMergeTab</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:16px;background:var(--c-bg-deep);margin:0}.page{max-width:412px;margin:0 auto;display:grid;gap:14px}h1{font-family:var(--ff-display);font-weight:600;font-size:20px;margin:0;color:var(--c-text);letter-spacing:.02em}.sub{color:var(--c-text-dim);font-size:12px;margin-top:4px}</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { PatchMergeTab } = window.TowerLikeGame_28197d;
  const mergeable = [
    { patchId:'a', name:'装甲補強',     iconName:'shield', tier:1, count:8 },
    { patchId:'b', name:'氷結トリガー', iconName:'ice',    tier:2, count:5 },
    { patchId:'c', name:'瞬殺装甲',     iconName:'skull',  tier:3, count:2 },
  ];
  function Page() {
    const [lim, setLim] = React.useState(4);
    return (
      <div className="page">
        <header><h1>PATCH MERGE TAB</h1><div className="sub">同 Tier 2 個 → Tier UP。一括合成で進める。</div></header>
        <PatchMergeTab mergeable={mergeable} maxTierLimit={lim} onLimitChange={setLim} onMergeAll={() => alert('合成実行')} />
        <h2 style={{fontFamily:'var(--ff-display)',color:'var(--c-text-dim)',fontSize:12,margin:'12px 0 0'}}>合成可能なし</h2>
        <PatchMergeTab mergeable={[]} maxTierLimit={3} onLimitChange={() => {}} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script></body></html>
