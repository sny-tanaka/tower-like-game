<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — ResultDialog</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 0; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stage {
    position: relative;
    height: 520px;
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, rgba(78,228,246,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(78,228,246,0.04) 0 1px, transparent 1px 24px),
      var(--c-bg-base);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { ResultDialog } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>RESULT DIALOG</h1>
          <div className="sub">バトル終了時に重ねるダイアログ。kind: clear / defeat / retreat。</div>
        </header>

        <div className="lbl">clear (クリア)</div>
        <div className="stage">
          <ResultDialog
            open
            kind="clear"
            stats={{ tier: 7, wave: 30, kills: 1248, durationSec: 412 }}
            rewards={{
              bolt: 1240, alloy: 4,
              patches: [
                { name: '氷結トリガー', iconName: 'ice', tier: 2 },
                { name: '瞬殺装甲', iconName: 'skull', tier: 3 },
              ],
            }}
          />
        </div>

        <div className="lbl">defeat (全滅)</div>
        <div className="stage">
          <ResultDialog
            open
            kind="defeat"
            stats={{ tier: 12, wave: 18, kills: 540, durationSec: 220 }}
            rewards={{
              bolt: 320, alloy: 1,
              patches: [{ name: '装甲補強', iconName: 'shield', tier: 1 }],
            }}
          />
        </div>

        <div className="lbl">retreat (撤退)</div>
        <div className="stage">
          <ResultDialog
            open
            kind="retreat"
            stats={{ tier: 5, wave: 12, kills: 280, durationSec: 145 }}
            rewards={{ bolt: 84, alloy: 0, patches: [] }}
          />
        </div>

        <div className="lbl">高 Tier クリア (無限スケール表記)</div>
        <div className="stage">
          <ResultDialog
            open
            kind="clear"
            stats={{ tier: 24, wave: 30, kills: 1.23e6, durationSec: 1840 }}
            rewards={{
              bolt: 150.5e6, alloy: 240,
              patches: [
                { name: '覚醒コア', iconName: 'spark', tier: 5 },
                { name: '連鎖燃焼', iconName: 'flame', tier: 4 },
                { name: '氷結トリガー', iconName: 'ice', tier: 2 },
              ],
            }}
          />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
