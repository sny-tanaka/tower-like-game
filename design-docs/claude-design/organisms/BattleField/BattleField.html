<!-- @dsCard group="Organisms" viewport="412x900" name="BattleField" subtitle="マシン + 敵 + 索敵円 + paused モック" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — BattleField</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .frame {
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    height: 340px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { BattleField } = window.TowerLikeGame_28197d;

  const enemiesNormal = [
    { angle: -0.6, distance: 0.85, kind: 'normal', hp: 0.8 },
    { angle: 0.3,  distance: 0.7,  kind: 'normal', hp: 0.5 },
    { angle: 1.2,  distance: 0.9,  kind: 'normal', hp: 1.0 },
    { angle: 2.4,  distance: 0.65, kind: 'normal', hp: 0.3 },
    { angle: 3.5,  distance: 0.78, kind: 'normal', hp: 0.6 },
    { angle: 4.8,  distance: 0.88, kind: 'normal', hp: 0.9 },
  ];

  const enemiesElite = [
    ...enemiesNormal.slice(0, 3),
    { angle: 5.4, distance: 0.55, kind: 'elite', hp: 0.7 },
    { angle: 0.8, distance: 0.6,  kind: 'elite', hp: 0.4 },
  ];

  const enemiesBoss = [
    { angle: 0, distance: 0.7, kind: 'boss', hp: 0.8 },
    ...enemiesNormal.slice(0, 4),
  ];

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>BATTLE FIELD</h1>
          <div className="sub">マシン中央固定 + 敵スポーン + 索敵円。本実装は SVG/Canvas、プレビューはモック。</div>
        </header>

        <div className="lbl">通常 wave (laser)</div>
        <div className="frame"><BattleField enemies={enemiesNormal} weapon="laser" /></div>

        <div className="lbl">エリート出現 (cannon)</div>
        <div className="frame"><BattleField enemies={enemiesElite} weapon="cannon" /></div>

        <div className="lbl">ボス戦 (cutter, 旋回半径表示)</div>
        <div className="frame"><BattleField enemies={enemiesBoss} weapon="cutter" cutterRadiusPct={22} /></div>

        <div className="lbl">paused</div>
        <div className="frame"><BattleField enemies={enemiesNormal} weapon="thunder" paused /></div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
