<!-- @dsCard group="Organisms" viewport="412x900" name="MainNav" subtitle="出撃準備画面から他画面への 5 タイル導線" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — MainNav</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .info { font-size: 11px; color: var(--c-text-dim); margin-top: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { MainNav } = window.TowerLikeGame_28197d;

  function Page() {
    const [clicked, setClicked] = React.useState(null);
    const items = [
      { key: 'machine', label: 'マシン強化', iconName: 'heart',    iconColor: 'var(--c-primary)' },
      { key: 'armory',  label: '武器庫',     iconName: 'laser',    iconColor: 'var(--c-primary)' },
      { key: 'patch',   label: 'パッチ庫',   iconName: 'spark',    iconColor: 'var(--c-secondary)', badge: 3 },
      { key: 'setting', label: '設定',       iconName: 'settings', iconColor: 'var(--c-text-mid)' },
      { key: 'title',   label: 'タイトル',   iconName: 'tower',    iconColor: 'var(--c-warning)' },
    ];

    return (
      <div className="page">
        <header>
          <h1>MAIN NAV</h1>
          <div className="sub">出撃準備画面 (PreparationScreen) からの他画面導線。</div>
        </header>

        <section>
          <h2>2 列 (default)</h2>
          <MainNav
            items={items.map((it) => ({ ...it, onClick: () => setClicked(it.key) }))}
            columns={2}
          />
          <div className="info">selected: {clicked || '(none)'}</div>
        </section>

        <section>
          <h2>3 列</h2>
          <MainNav
            items={items.map((it) => ({ ...it, onClick: () => setClicked(it.key) }))}
            columns={3}
          />
        </section>

        <section>
          <h2>badge / disabled</h2>
          <MainNav
            items={[
              { key: 'machine', label: 'マシン強化', iconName: 'heart',    iconColor: 'var(--c-primary)',   badge: '新' },
              { key: 'armory',  label: '武器庫',     iconName: 'laser',    iconColor: 'var(--c-primary)' },
              { key: 'patch',   label: 'パッチ庫',   iconName: 'spark',    iconColor: 'var(--c-secondary)', badge: 12 },
              { key: 'setting', label: '設定',       iconName: 'settings', iconColor: 'var(--c-text-mid)' },
              { key: 'lock',    label: '???', iconName: 'shield', iconColor: 'var(--c-text-mid)', disabled: true },
              { key: 'lock2',   label: '???', iconName: 'shield', iconColor: 'var(--c-text-mid)', disabled: true },
            ]}
            columns={3}
          />
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
