<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — PageHeader</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  .lbl { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); display: flex; align-items: center; gap: 8px; }
  .lbl::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .frame {
    border: 1px solid var(--c-border-faint);
    border-radius: var(--r-m);
    overflow: hidden;
    background: var(--c-bg-deep);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { PageHeader, IconButton } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>PAGE HEADER</h1>
          <div className="sub">画面共通ヘッダ。各画面で使う通貨のみ表示。</div>
        </header>

        <div className="lbl">マシン強化 (bolt のみ)</div>
        <div className="frame">
          <PageHeader title="マシン強化" onBack={() => {}} currencies={[{ kind: 'bolt', value: 1234567 }]} />
        </div>

        <div className="lbl">武器庫 (bolt + alloy)</div>
        <div className="frame">
          <PageHeader title="武器庫" onBack={() => {}} currencies={[{ kind: 'bolt', value: 1234567 }, { kind: 'alloy', value: 845 }]} />
        </div>

        <div className="lbl">パッチ庫 (通貨なし)</div>
        <div className="frame">
          <PageHeader title="パッチ庫" subtitle="装着 6 / 8 · 在庫 42 種" onBack={() => {}} />
        </div>

        <div className="lbl">タイトル (戻る無し)</div>
        <div className="frame">
          <PageHeader title="TOWER LIKE GAME" subtitle="v0.1.0" />
        </div>

        <div className="lbl">出撃準備 (3 通貨全部 + 設定アイコン)</div>
        <div className="frame">
          <PageHeader
            title="出撃準備"
            onBack={() => {}}
            currencies={[
              { kind: 'screw', value: 0 },
              { kind: 'bolt', value: 1234567 },
              { kind: 'alloy', value: 845 },
            ]}
            actions={<IconButton icon="settings" label="設定" variant="ghost" size="sm" />}
          />
        </div>

        <div className="lbl">長いタイトル (truncate)</div>
        <div className="frame">
          <PageHeader title="非常に長い画面タイトル名のテスト表示" subtitle="サブタイトルも省略表示の対象" onBack={() => {}} currencies={[{ kind: 'bolt', value: 999 }]} />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
