<!-- @dsCard group="Organisms" viewport="412x900" name="TierSelectTab" subtitle="最新到達 Tier までを表示。先の Tier は出ない" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Organism — TierSelectTab</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; margin: 0; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { TierSelectTab } = window.TowerLikeGame_28197d;
  function Page() {
    const [t1, set1] = React.useState(3);
    const [t2, set2] = React.useState(8);
    const [t3, set3] = React.useState(15);
    return (
      <div className="page">
        <header><h1>TIER SELECT TAB</h1><div className="sub">Tier は無限スケール。先 Tier は表示せず最新 (frontier) までだけを並べる。</div></header>
        <section><h2>序盤 (maxTier=5)</h2><TierSelectTab maxTier={5} selectedTier={t1} onSelect={set1} /></section>
        <section><h2>進行中 (maxTier=10)</h2><TierSelectTab maxTier={10} selectedTier={t2} onSelect={set2} /></section>
        <section><h2>後半 (maxTier=18)</h2><TierSelectTab maxTier={18} selectedTier={t3} onSelect={set3} /></section>
        <section><h2>開始直後 (maxTier=1)</h2><TierSelectTab maxTier={1} selectedTier={1} /></section>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
