<!-- @dsCard group="Molecules" viewport="720x900" name="EnemyHpBar" subtitle="elite / boss / tier-normal × sm / md / lg" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — EnemyHpBar</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stack { display: grid; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { EnemyHpBar } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>ENEMY HP BAR</h1>
          <div className="sub">エリート / ボス 専用の HP 表示。バトルフィールド上端や追跡ピンに使用。</div>
        </header>

        <section>
          <h2>elite</h2>
          <div className="stack">
            <EnemyHpBar variant="elite" name="装甲斥候 mk.III" current={1280} max={1500} />
            <EnemyHpBar variant="elite" name="高速突撃機" current={620} max={1500} />
            <EnemyHpBar variant="elite" name="シールド精鋭" current={120} max={1500} />
          </div>
        </section>

        <section>
          <h2>boss</h2>
          <div className="stack">
            <EnemyHpBar variant="boss" name="Tier 5 ボス: 双角ヴァングィア" current={4_500_000} max={5_200_000} size="lg" />
            <EnemyHpBar variant="boss" name="Tier 10 ボス: 終焉のコア" current={1.23e9} max={2.5e9} size="lg" />
          </div>
        </section>

        <section>
          <h2>normal (Tier 表示)</h2>
          <div className="stack">
            <EnemyHpBar variant="normal" tier={3} name="ジャンク兵 ×8" current={840} max={1200} size="sm" />
            <EnemyHpBar variant="normal" tier={7} name="高 Tier 通常敵" current={520} max={1200} size="sm" />
          </div>
        </section>

        <section>
          <h2>showValue=false (バーのみ)</h2>
          <div className="stack">
            <EnemyHpBar variant="elite" name="装甲斥候 mk.III" current={1280} max={1500} showValue={false} />
            <EnemyHpBar variant="boss" name="Tier 5 ボス" current={4_500_000} max={5_200_000} showValue={false} />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
