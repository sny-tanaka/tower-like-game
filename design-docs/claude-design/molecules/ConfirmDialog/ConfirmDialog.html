<!-- @dsCard group="Molecules" viewport="412x900" name="ConfirmDialog" subtitle="default / danger × icon × custom labels" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — ConfirmDialog</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stage {
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.6), rgba(0,0,0,0.85));
    border: 1px dashed var(--c-border-faint);
    border-radius: var(--r-m);
    padding: 24px 16px;
    display: flex; justify-content: center;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { ConfirmDialog } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>CONFIRM DIALOG</h1>
          <div className="sub">本体のみ。Overlay は別途 Atom が包む。背景はオーバーレイ想定で暗色。</div>
        </header>

        <section>
          <h2>default — 出撃確認</h2>
          <div className="stage">
            <ConfirmDialog
              title="出撃しますか？"
              message="Tier 7 から開始します。装備中のパッチが適用されます。"
              iconName="play"
              confirmLabel="出撃"
              cancelLabel="準備に戻る"
            />
          </div>
        </section>

        <section>
          <h2>danger — 撤退確認</h2>
          <div className="stage">
            <ConfirmDialog
              variant="danger"
              title="ラン破棄して撤退？"
              message="このランで獲得したネジは失われます。ボルトと超合金は保持されます。"
              iconName="skull"
              confirmLabel="撤退する"
              cancelLabel="続行"
            />
          </div>
        </section>

        <section>
          <h2>danger — 全データリセット</h2>
          <div className="stage">
            <ConfirmDialog
              variant="danger"
              title="全データをリセット？"
              message="マシン強化 / 武器強化 / 所持パッチ含め、すべてが初期状態に戻ります。この操作は取り消せません。"
              iconName="info"
              confirmLabel="リセット"
              cancelLabel="やめる"
            />
          </div>
        </section>

        <section>
          <h2>icon なし</h2>
          <div className="stage">
            <ConfirmDialog
              title="設定を保存しました"
              message="変更内容は次回起動時から反映されます。"
              confirmLabel="OK"
              cancelLabel="戻る"
            />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
