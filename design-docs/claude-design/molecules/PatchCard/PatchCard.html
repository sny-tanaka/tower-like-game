<!-- @dsCard group="Molecules" viewport="412x1100" name="PatchCard" subtitle="Tier 1-5 × ストック数 × 選択/合成プレビュー" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — PatchCard</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; justify-items: center; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; justify-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { PatchCard } = window.TowerLikeGame_28197d;

  function Page() {
    const [sel, setSel] = React.useState('instant-kill');
    return (
      <div className="page">
        <header>
          <h1>PATCH CARD</h1>
          <div className="sub">条件付きパッシブスキル。Tier 1→5 で色が変化、合成で Tier UP。</div>
        </header>

        <section>
          <h2>Tier 1-5 (sample)</h2>
          <div className="grid">
            <PatchCard patchId="p1" name="装甲補強" iconName="shield" tier={1} trigger="常時" effect="被ダメ -5%" count={4} />
            <PatchCard patchId="p2" name="氷結トリガー" iconName="ice" tier={2} trigger="クリ発動時" effect="2 秒凍結" count={2} />
            <PatchCard patchId="p3" name="瞬殺装甲" iconName="skull" tier={3} trigger="HP 25% 以下" effect="敵を即死" count={1} selected />
            <PatchCard patchId="p4" name="連鎖燃焼" iconName="flame" tier={4} trigger="貫通ヒット時" effect="周囲焼夷" count={1} />
            <PatchCard patchId="p5" name="覚醒コア" iconName="spark" tier={5} trigger="Wave 開始時" effect="全攻撃 +50%" count={1} />
          </div>
        </section>

        <section>
          <h2>選択 (interactive)</h2>
          <div className="grid">
            {[
              { id: 'instant-kill', name: '瞬殺装甲', icon: 'skull', tier: 3, trigger: 'HP 25%↓', effect: '敵を即死' },
              { id: 'frost-bolt',   name: '氷結トリガー', icon: 'ice',   tier: 2, trigger: 'クリ時', effect: '2 秒凍結' },
              { id: 'overload',     name: '過剰負荷', icon: 'flame', tier: 4, trigger: '範囲時', effect: '燃焼継続' },
              { id: 'shield-break', name: 'シールド貫通', icon: 'lightning', tier: 5, trigger: '常時', effect: 'シールド無効' },
            ].map((p) => (
              <PatchCard
                key={p.id}
                patchId={p.id}
                name={p.name}
                iconName={p.icon}
                tier={p.tier}
                trigger={p.trigger}
                effect={p.effect}
                count={1}
                selected={sel === p.id}
                onClick={() => setSel(p.id)}
              />
            ))}
          </div>
          <div style={{ fontSize: 11, color: 'var(--c-text-dim)', marginTop: 8 }}>selected: {sel}</div>
        </section>

        <section>
          <h2>状態: 合成中 / ロック / 在庫 0</h2>
          <div className="grid">
            <PatchCard patchId="merge-a" name="氷結トリガー" iconName="ice" tier={2} count={2} merging trigger="クリ時" effect="2 秒凍結" />
            <PatchCard patchId="lock-a"  name="覚醒コア" iconName="spark" tier={5} count={0} locked trigger="???" effect="???" />
            <PatchCard patchId="zero-a"  name="装甲補強" iconName="shield" tier={1} count={0} trigger="常時" effect="被ダメ -5%" />
            <PatchCard patchId="dis-a"   name="過剰負荷" iconName="flame" tier={4} count={3} disabled trigger="範囲時" effect="燃焼継続" />
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div className="grid-3">
            <PatchCard patchId="s-sm" name="瞬殺装甲" iconName="skull" tier={3} trigger="HP25%↓" effect="即死" count={2} size="sm" />
            <PatchCard patchId="s-md" name="瞬殺装甲" iconName="skull" tier={3} trigger="HP25%↓" effect="即死" count={2} size="md" />
            <PatchCard patchId="s-lg" name="瞬殺装甲" iconName="skull" tier={3} trigger="HP25%↓" effect="即死" count={2} size="lg" />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
