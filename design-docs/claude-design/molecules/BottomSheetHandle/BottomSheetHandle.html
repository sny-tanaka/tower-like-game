<!-- @dsCard group="Molecules" viewport="412x500" name="BottomSheetHandle" subtitle="ドラッグハンドル（dragging 状態で cyan-glow）" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — BottomSheetHandle</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }

  .sheet-sim {
    background: var(--c-bg-elev);
    border-top: 1px solid var(--c-border);
    border-radius: var(--r-l) var(--r-l) 0 0;
    padding-bottom: 14px;
  }
  .sheet-body {
    padding: 10px 16px 4px;
    color: var(--c-text-mid);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { BottomSheetHandle } = window.TowerLikeGame_28197d;

  function Page() {
    const [drag, setDrag] = React.useState(false);
    return (
      <div className="page">
        <header>
          <h1>BOTTOM SHEET HANDLE</h1>
          <div className="sub">ボトムシート上端のドラッグハンドル。dragging で cyan-glow。</div>
        </header>

        <section>
          <h2>idle / dragging</h2>
          <div className="sheet-sim">
            <BottomSheetHandle />
            <div className="sheet-body">idle (タップして dragging プレビュー)</div>
          </div>
          <div style={{ height: 12 }} />
          <div className="sheet-sim">
            <BottomSheetHandle dragging />
            <div className="sheet-body">dragging (Fx 内部で width 拡大などを上乗せ可)</div>
          </div>
        </section>

        <section>
          <h2>interactive (pointer-down で dragging 化)</h2>
          <div
            className="sheet-sim"
            onPointerUp={() => setDrag(false)}
            onPointerLeave={() => setDrag(false)}
          >
            <BottomSheetHandle dragging={drag} onPointerDown={() => setDrag(true)} />
            <div className="sheet-body">{drag ? 'DRAGGING' : 'タップして dragging on'}</div>
          </div>
        </section>

        <section>
          <h2>width バリエーション</h2>
          <div className="sheet-sim"><BottomSheetHandle width={28} /></div>
          <div style={{ height: 6 }} />
          <div className="sheet-sim"><BottomSheetHandle width={40} /></div>
          <div style={{ height: 6 }} />
          <div className="sheet-sim"><BottomSheetHandle width={64} /></div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
