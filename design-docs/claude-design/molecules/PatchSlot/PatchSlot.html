<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — PatchSlot</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; justify-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { PatchSlot } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>PATCH SLOT</h1>
          <div className="sub">パッチ庫の装着スロット 1 個。状態 3 種: filled / empty / locked。</div>
        </header>

        <section>
          <h2>装着画面 (8 スロット、6 装着 + 1 空き + 1 ロック)</h2>
          <div className="grid">
            <PatchSlot patch={{ patchId: 'p1', name: '装甲補強',     iconName: 'shield',    tier: 1, trigger: '常時',       effect: '被ダメ -5%',   count: 4 }} />
            <PatchSlot patch={{ patchId: 'p2', name: '氷結トリガー', iconName: 'ice',       tier: 2, trigger: 'クリ発動時', effect: '2 秒凍結',     count: 2 }} />
            <PatchSlot patch={{ patchId: 'p3', name: '瞬殺装甲',     iconName: 'skull',     tier: 3, trigger: 'HP 25% ↓',   effect: '敵を即死',     count: 1 }} />
            <PatchSlot patch={{ patchId: 'p4', name: '連鎖燃焼',     iconName: 'flame',     tier: 4, trigger: '貫通時',     effect: '周囲焼夷',     count: 1 }} />
            <PatchSlot patch={{ patchId: 'p5', name: '覚醒コア',     iconName: 'spark',     tier: 5, trigger: 'Wave 開始',  effect: '全攻撃 +50%',  count: 1 }} />
            <PatchSlot patch={{ patchId: 'p6', name: 'シールド貫通', iconName: 'lightning', tier: 3, trigger: '常時',       effect: 'シールド無効', count: 1 }} />
            <PatchSlot slotIndex={7} />
            <PatchSlot locked slotIndex={8} />
          </div>
        </section>

        <section>
          <h2>空き / ロックの個別</h2>
          <div className="grid">
            <PatchSlot slotIndex={1} />
            <PatchSlot slotIndex={2} />
            <PatchSlot locked slotIndex={3} />
            <PatchSlot locked slotIndex={4} />
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap', alignItems: 'flex-start' }}>
            <PatchSlot size="sm" patch={{ patchId: 'pa', name: '瞬殺装甲', iconName: 'skull', tier: 3, trigger: 'HP25%↓', effect: '即死', count: 1 }} />
            <PatchSlot size="md" patch={{ patchId: 'pb', name: '瞬殺装甲', iconName: 'skull', tier: 3, trigger: 'HP25%↓', effect: '即死', count: 1 }} />
            <PatchSlot size="lg" patch={{ patchId: 'pc', name: '瞬殺装甲', iconName: 'skull', tier: 3, trigger: 'HP25%↓', effect: '即死', count: 1 }} />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
