<!-- @dsCard group="Molecules" viewport="720x900" name="WaveProgressBar" subtitle="現 Wave + 残量バー + 次マイルストーン" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — WaveProgressBar</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stack { display: grid; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { WaveProgressBar } = window.TowerLikeGame_28197d;

  function Page() {
    return (
      <div className="page">
        <header>
          <h1>WAVE PROGRESS BAR</h1>
          <div className="sub">上 HUD で常時表示。残量が減るほどバーが減る (reverse)。</div>
        </header>

        <section>
          <h2>milestone なし</h2>
          <div className="stack">
            <WaveProgressBar waveNumber={3} secondsLeft={42} secondsMax={60} />
            <WaveProgressBar waveNumber={3} secondsLeft={18} secondsMax={60} />
            <WaveProgressBar waveNumber={3} secondsLeft={3}  secondsMax={60} />
          </div>
        </section>

        <section>
          <h2>milestone: elite / boss</h2>
          <div className="stack">
            <WaveProgressBar waveNumber={4} secondsLeft={50} secondsMax={60} nextMilestone={{ wave: 5, kind: 'elite' }} />
            <WaveProgressBar waveNumber={9} secondsLeft={28} secondsMax={60} nextMilestone={{ wave: 10, kind: 'boss' }} />
            <WaveProgressBar waveNumber={19} secondsLeft={10} secondsMax={60} nextMilestone={{ wave: 20, kind: 'boss' }} />
          </div>
        </section>

        <section>
          <h2>milestone: tier-up</h2>
          <div className="stack">
            <WaveProgressBar waveNumber={14} secondsLeft={32} secondsMax={60} nextMilestone={{ wave: 15, kind: 'tier-up' }} />
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div className="stack">
            <WaveProgressBar waveNumber={7} secondsLeft={35} secondsMax={60} size="sm" />
            <WaveProgressBar waveNumber={7} secondsLeft={35} secondsMax={60} size="md" />
            <WaveProgressBar waveNumber={7} secondsLeft={35} secondsMax={60} size="lg" />
          </div>
        </section>

        <section>
          <h2>showSeconds=false</h2>
          <div className="stack">
            <WaveProgressBar waveNumber={5} secondsLeft={40} secondsMax={60} nextMilestone={{ wave: 10, kind: 'boss' }} showSeconds={false} />
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
