<!-- @dsCard group="Molecules" viewport="720x900" name="WeaponSlotIcon" subtitle="バトル下 HUD の武器スロット 1 枚 (CD + active + swap-disabled)" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — WeaponSlotIcon</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 32px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 660px; margin: 0 auto; display: grid; gap: 22px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 24px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 18px 20px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 12px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ''; width: 6px; height: 6px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 14px; }
  .lbl { font-family: var(--ff-numeric); font-size: 10px; color: var(--c-text-dim); letter-spacing: var(--ls-num); width: 110px; }
  .hud { background: var(--c-bg-base); border-radius: var(--r-m); padding: 14px 18px; display: flex; align-items: center; gap: 14px; justify-content: center; border: 1px solid var(--c-border-faint); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { WeaponSlotIcon } = window.TowerLikeGame_28197d;

  function Page() {
    const [active, setActive] = React.useState('laser');
    return (
      <div className="page">
        <header>
          <h1>WEAPON SLOT ICON</h1>
          <div className="sub">CircularProgress(CD) を Icon に重ねた円形スロット。active / ready / swapDisabled の 3 状態。</div>
        </header>

        <section>
          <h2>state (md)</h2>
          <div className="row">
            <span className="lbl">ready + active</span>
            <WeaponSlotIcon weapon="laser" active ready cdProgress={100} />
            <WeaponSlotIcon weapon="cannon" active ready cdProgress={100} />
            <WeaponSlotIcon weapon="thunder" active ready cdProgress={100} />
            <WeaponSlotIcon weapon="cutter" active ready cdProgress={100} />
          </div>
          <div className="row">
            <span className="lbl">ready (idle)</span>
            <WeaponSlotIcon weapon="laser" ready cdProgress={100} />
            <WeaponSlotIcon weapon="cannon" ready cdProgress={100} />
            <WeaponSlotIcon weapon="thunder" ready cdProgress={100} />
            <WeaponSlotIcon weapon="cutter" ready cdProgress={100} />
          </div>
          <div className="row">
            <span className="lbl">CD 中</span>
            <WeaponSlotIcon weapon="laser" cdProgress={28} ready={false} />
            <WeaponSlotIcon weapon="cannon" cdProgress={55} ready={false} />
            <WeaponSlotIcon weapon="thunder" cdProgress={72} ready={false} />
            <WeaponSlotIcon weapon="cutter" cdProgress={92} ready={false} />
          </div>
          <div className="row">
            <span className="lbl">切替 CD 中</span>
            <WeaponSlotIcon weapon="laser" cdProgress={50} swapDisabled />
            <WeaponSlotIcon weapon="cannon" active cdProgress={50} swapDisabled />
            <WeaponSlotIcon weapon="thunder" cdProgress={50} swapDisabled />
            <WeaponSlotIcon weapon="cutter" cdProgress={50} swapDisabled />
          </div>
        </section>

        <section>
          <h2>size</h2>
          <div className="row">
            <span className="lbl">sm 40</span>
            <WeaponSlotIcon weapon="laser" active ready cdProgress={100} size="sm" />
            <WeaponSlotIcon weapon="cannon" ready cdProgress={100} size="sm" />
          </div>
          <div className="row">
            <span className="lbl">md 52</span>
            <WeaponSlotIcon weapon="laser" active ready cdProgress={100} size="md" />
            <WeaponSlotIcon weapon="cannon" ready cdProgress={100} size="md" />
          </div>
          <div className="row">
            <span className="lbl">lg 64</span>
            <WeaponSlotIcon weapon="laser" active ready cdProgress={100} size="lg" />
            <WeaponSlotIcon weapon="cannon" ready cdProgress={100} size="lg" />
          </div>
        </section>

        <section>
          <h2>バトル下 HUD 4 スロット (interactive)</h2>
          <div className="hud">
            {['laser', 'cannon', 'thunder', 'cutter'].map((w, i) => (
              <WeaponSlotIcon
                key={w}
                weapon={w}
                active={active === w}
                ready={[100, 64, 90, 22][i] >= 100}
                cdProgress={[100, 64, 90, 22][i]}
                onClick={() => setActive(w)}
              />
            ))}
          </div>
          <div style={{ fontSize: 11, color: 'var(--c-text-dim)', marginTop: 8, textAlign: 'center' }}>
            active: {active}
          </div>
        </section>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
