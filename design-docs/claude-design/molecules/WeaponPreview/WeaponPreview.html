<!-- @dsCard group="Molecules" viewport="412x1200" name="WeaponPreview" subtitle="出撃準備 (tall) / 武器庫 (wide) × active / locked" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Molecule — WeaponPreview</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 16px; background: var(--c-bg-deep); min-height: 100vh; }
  .page { max-width: 412px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-family: var(--ff-display); font-weight: 600; font-size: 20px; margin: 0; color: var(--c-text); letter-spacing: 0.02em; }
  .sub { color: var(--c-text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--c-bg-elev); border: 1px solid var(--c-border-faint); border-radius: var(--r-m); padding: 14px; }
  h2 { font-family: var(--ff-display); font-weight: 600; font-size: 11px; letter-spacing: var(--ls-loose); text-transform: uppercase; color: var(--c-primary); margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; width: 5px; height: 5px; background: var(--c-primary); box-shadow: var(--glow-cyan-sm); transform: rotate(45deg); }
  .stack { display: grid; gap: 10px; }
  .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
  const { WeaponPreview } = window.TowerLikeGame_28197d;

  function Page() {
    const [active, setActive] = React.useState('laser');

    const w = {
      laser:   { name: 'LASER',   description: '高速直進ビーム。貫通でき、連発で削り続ける。',     stats: [{label:'DAMAGE',value:120,accent:'primary'},{label:'貫通数',value:3},{label:'射程',value:580,suffix:'m'},{label:'連射',value:6.2,suffix:'/s'}] },
      cannon:  { name: 'CANNON',  description: '範囲爆発で群れを薙ぎ払う重火力。',                   stats: [{label:'DAMAGE',value:480,accent:'primary'},{label:'爆発半径',value:120,suffix:'m'},{label:'射程',value:520,suffix:'m'},{label:'連射',value:0.9,suffix:'/s'}] },
      thunder: { name: 'THUNDER', description: '隣接敵に連鎖する電撃。シールドに有効。',             stats: [{label:'DAMAGE',value:84,accent:'primary'},{label:'連鎖数',value:5},{label:'射程',value:420,suffix:'m'},{label:'連射',value:3.4,suffix:'/s'}] },
      cutter:  { name: 'CUTTER',  description: '旋回斬撃。マシン周囲を高速で回りつつ攻撃。',         stats: [{label:'DAMAGE',value:62,accent:'primary'},{label:'旋回半径',value:180,suffix:'m'},{label:'同時ヒット',value:4},{label:'連射',value:8.0,suffix:'/s'}] },
    };

    return (
      <div className="page">
        <header>
          <h1>WEAPON PREVIEW</h1>
          <div className="sub">出撃準備 (tall) / 武器庫の詳細 (wide) で共用。stats を可変表示。</div>
        </header>

        <section>
          <h2>tall — 出撃準備 武器選択タブ (interactive)</h2>
          <div className="col2">
            {['laser', 'cannon', 'thunder', 'cutter'].map((k) => (
              <WeaponPreview
                key={k}
                weapon={k}
                name={w[k].name}
                description={w[k].description}
                stats={w[k].stats}
                active={active === k}
                onClick={() => setActive(k)}
              />
            ))}
          </div>
          <div style={{ fontSize: 11, color: 'var(--c-text-dim)', marginTop: 8 }}>selected: {active}</div>
        </section>

        <section>
          <h2>wide — 武器庫の詳細タブ</h2>
          <div className="stack">
            <WeaponPreview layout="wide" weapon="laser"   name={w.laser.name}   description={w.laser.description}   stats={w.laser.stats} active />
            <WeaponPreview layout="wide" weapon="cannon"  name={w.cannon.name}  description={w.cannon.description}  stats={w.cannon.stats} />
            <WeaponPreview layout="wide" weapon="thunder" name={w.thunder.name} description={w.thunder.description} stats={w.thunder.stats} />
            <WeaponPreview layout="wide" weapon="cutter"  name={w.cutter.name}  description={w.cutter.description}  stats={w.cutter.stats} />
          </div>
        </section>

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
