<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- safe area 外側の色 (Safari の status bar 周辺など) を AppShell 背景の
         最深部 (--c-bg-deep = #04060d) と揃える。
         #000000 のままだと shell の base 色との微差で帯のように見えてしまう。 -->
    <meta name="theme-color" content="#04060d" />
    <meta name="description" content="NEON SPIRE — サイバーフューチャー調のタワーディフェンス PWA" />
    <!-- iOS PWA: ステータスバーを透明化 (Issue #78 焼き付き対策)。 アプリ全体は AppShell が
         env(safe-area-inset-top) 分の padding を確保しているため、 ヘッダーが時計裏に潜らない。
         ScreenSaverDialog の #000 背景がステータスバー裏まで伸び、 時計/バッテリー文字を視認不能化。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEON SPIRE</title>
    <!-- Google Fonts: デザイントークン tokens.scss で使用するフォントを先読みして初回ロードを高速化 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <script type="module" crossorigin src="/tower-like-game/assets/index-B8eSt7N_.js"></script>
    <link rel="stylesheet" crossorigin href="/tower-like-game/assets/index-P7fxEFfA.css">
  <link rel="manifest" href="/tower-like-game/manifest.webmanifest"></head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
